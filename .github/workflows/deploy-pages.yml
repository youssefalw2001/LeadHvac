name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows deploying manually from the Actions tab without pushing.
  workflow_dispatch:

# Only the contents needed to publish. No secrets are used by this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling a partially-published deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Build
        # Repository is served from https://<owner>.github.io/LeadHvac/
        env:
          VITE_BASE_PATH: /LeadHvac/
        run: npm run build

      - name: Add .nojekyll
        # Stops GitHub Pages running Jekyll, which would ignore _-prefixed assets.
        run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
